<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Kettle Linux boot menu background (800x600) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.6" stop-color="#17123d"/>
      <stop offset="1" stop-color="#341a47"/>
    </linearGradient>
    <radialGradient id="ember" cx="640" cy="600" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f0743e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc75f"/>
      <stop offset="1" stop-color="#f0743e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#ember)"/>

  <g transform="translate(336 60) scale(0.5)">
    <g fill="none" stroke="#ffd98a" stroke-width="9" stroke-linecap="round">
      <path d="M110 50 C 98 38, 122 30, 110 14"/>
      <path d="M146 50 C 134 38, 158 30, 146 14"/>
    </g>
    <path d="M82 108 C 82 62, 174 62, 174 108" fill="none" stroke="url(#body)" stroke-width="16" stroke-linecap="round"/>
    <path d="M186 148 L 230 108 L 240 120 L 202 184 Z" fill="url(#body)"/>
    <path d="M58 212 C 50 150, 80 106, 128 106 C 176 106, 206 150, 198 212 Z" fill="url(#body)"/>
    <rect x="46" y="206" width="164" height="20" rx="10" fill="#d9573a"/>
    <circle cx="128" cy="98" r="11" fill="#ffd98a"/>
  </g>

  <text x="400" y="232" text-anchor="middle" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="300" letter-spacing="3">Kettle Linux</text>
  <text x="400" y="262" text-anchor="middle" fill="#c9bfe8" font-family="DejaVu Sans, sans-serif" font-size="15">1.0 "Rolling Boil"</text>
</svg>
