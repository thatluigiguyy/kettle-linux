# Builds the Kettle Linux ISO on GitHub's servers and publishes it as a release.
name: Build Kettle Linux ISO

on:
  push:
    branches: [main]
    paths: ['kettle-os/**', '.github/workflows/build-iso.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Get the Kettle recipe
        uses: actions/checkout@v5

      - name: Make room on the build server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Build the ISO inside Debian 13
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            -e CI=1 \
            debian:trixie \
            bash /src/kettle-os/build.sh

      - name: Prepare release files
        id: files
        run: |
          sudo chown -R "$(id -u):$(id -g)" kettle-os/out   # Docker created it as root
          cd kettle-os/out
          ls -lh
          ISO=$(ls *.iso | head -n1)
          sha256sum "$ISO" > SHA256SUMS.txt
          # GitHub release files must be under 2 GB: split if needed
          if [ "$(stat -c %s "$ISO")" -gt 2140000000 ]; then
            split -b 1900M -d -a 1 "$ISO" "$ISO.part"
            rm "$ISO"
            PARTS=$(ls "$ISO".part* | xargs -n1 basename | paste -sd+ | sed 's/+/ + /g')
            printf 'The ISO is split into parts because GitHub limits files to 2 GB.\nDownload all parts into one folder, open Command Prompt there and run:\n\n  copy /b %s %s\n' "$PARTS" "$ISO" > HOW-TO-JOIN.txt
          fi

      - name: Publish release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a newer build of 1.0 replaces the old one
          gh release delete v1.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0 kettle-os/out/* \
            --latest \
            --title "Kettle Linux 1.0 \"Rolling Boil\"" \
            --notes "$(cat <<'EOF'
          The first big Kettle Linux release: Debian 13 with a KDE Plasma 6 desktop, Kettle wallpaper, logo, floating dock, boot and login splash screens, and the Discover app store with Flathub.

          **Boot it in VirtualBox**
          1. New VM. Type: Linux, Version: Debian (64-bit).
          2. 4 GB RAM, 2 or more CPUs.
          3. Display: graphics controller VMSVGA, 128 MB video memory.
          4. System: tick Enable EFI.
          5. Attach the .iso as the optical drive and press Start.
          EOF
          )"
